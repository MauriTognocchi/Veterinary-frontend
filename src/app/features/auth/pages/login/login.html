<section class="login-container">
  <div class="login-card">
    <h2>Iniciar sesión</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          autocomplete="username"
        />
        @if (loginForm.get('username')?.touched && loginForm.get('username')?.invalid) {
          <small class="error">El usuario es obligatorio.</small>
        }
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
        @if (loginForm.get('password')?.touched && loginForm.get('password')?.invalid) {
          <small class="error">La contraseña es obligatorio.</small>
        }
      </div>

      @if (error()) {
        <div class="error-message">{{ error() }}</div>
      }

      <button type="submit" [disabled]="loading() || loginForm.invalid">
        @if (loading()) {
          Iniciando sesión...
        } @else {
          Iniciar sesión
        }
      </button>
    </form>
  </div>
</section>
